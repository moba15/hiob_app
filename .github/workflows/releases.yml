name: Build Releases
on: 
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "development"
      - "protobuf"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
env:
  FLUTTER_VERSION: 3.44.8
jobs:
  check-format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: '21.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check format
        run: make format-check
  build-appbundle:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        flavor: [prod, dev]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: '21.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'keystore/your_signing_keystore.jks'
          fileDir: "/home/runner/work/hiob_app/hiob_app/android/app/"
          encodedString: ${{ secrets.KEYSTORE }}
      - run: flutter pub get
      - name: Build bundle, release
        run: make build-android-appbundle-${{ matrix.flavor }}
        env:
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-appbundle-${{ matrix.flavor }}
          path: build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
          compression-level: 1
  build-apk:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        flavor: [prod, dev]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: '21.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'keystore/your_signing_keystore.jks'
          fileDir: "/home/runner/work/hiob_app/hiob_app/android/app/"
          encodedString: ${{ secrets.FAKEKEYSTORE }}
      - run: flutter pub get
      - name: Build apk
        run: make build-android-apk-${{ matrix.flavor }}
        env:
          KEYALIAS: ${{ secrets.FAKEKEYALIAS }}
          KEYPASSWORD: ${{ secrets.FAKEKEYPASSWORD }}
          STOREPASSWORD: ${{ secrets.FAKESTOREPASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ matrix.flavor }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          compression-level: 1
  build-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v1
      - name: Install build tools
        run: sudo apt-get install -y libgtk-3-0 libblkid1 liblzma5 ninja-build libgtk-3-dev libsecret-1-dev pkg-config libjsoncpp-dev
      - name: Setup Flutter (manual for arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git $HOME/flutter
          cd $HOME/flutter
          git checkout ${{ env.FLUTTER_VERSION }}
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "PUB_CACHE=$HOME/.pub-cache" >> $GITHUB_ENV
          $HOME/flutter/bin/flutter --version
          $HOME/flutter/bin/flutter precache --linux --linux-arm64
      - uses: subosito/flutter-action@v2
        if: matrix.arch != 'arm64'
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build linux
        run: make build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.arch }}
          path: build/linux/${{ matrix.arch }}/release/bundle/
          compression-level: 6
  build-windows:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/checkout@v2
      - uses: actions/setup-dotnet@v1
      - name: Build windows
        run: make build-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ matrix.arch }}
          path: build/windows/${{ matrix.arch }}/runner/Release/
          compression-level: 6
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macos
        run: make build-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/
          compression-level: 6
  github-release:
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos, build-apk, check-format]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-release-*
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-release-*
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/macos-release/
      - uses: actions/download-artifact@v4
        with:
          pattern: release-apks-*
          merge-multiple: true
          path: artifacts/release-apks/
      - name: Zip Folder
        run: |
          mkdir artifacts/zip
          cd artifacts
          for d in linux-release-* windows-release-* macos-release; do
            if [ -d "$d" ]; then
              zip -r "zip/$d.zip" "$d/"
            fi
          done
          zip -r zip/release-apks.zip release-apks/
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/zip/*"
          prerelease: ${{contains(github.ref_name, 'beta')}}
          replacesArtifacts: true
          draft: true
          allowUpdates: true          
